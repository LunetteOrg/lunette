name: CI

# Two gates, and neither stands in for the other.
#
# `gate` is the one `CLAUDE.md` defines, run by a machine instead of by memory:
# `pnpm -r test` (vitest, with the `*.test-d.ts` type contract typechecked
# inside the run) and `pnpm -r typecheck` (`tsc --noEmit`). Both run on every
# push, the second even when the first has already failed, or a red suite would
# hide a type error behind it. They resolve `@lntt/*` to the SOURCES.
#
# `verify` asks the other question: is what we SHIP still what those gates
# passed against? It builds, then checks the published package three ways: the
# type contract recompiled against the BUILT declarations, the suites that
# import `@lntt/*` by name re-run through `exports` into `dist`, and the
# tarballs packed, unpacked and imported entry point by entry point. A
# declaration that widened a branded conditional turns a compile error into a
# silence in someone else's editor, and this is where that silence becomes a
# red build.
#
# `pnpm -r` reaches `research/*` too, because `pnpm-workspace.yaml` lists it.
# That is deliberate: research is excluded from CODE REVIEW (it is a proving
# ground, not shipped product) but its suites are the measurements the decision
# record cites, so a decision whose evidence has rotted should turn the gate
# red like anything else. They cost about a second.

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes the run before it on the same branch. `main` is the
# exception: its runs are the record of what was green, so they finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No version here on purpose: `pnpm/action-setup` reads the
      # `packageManager` field of the root `package.json`, so the pinned pnpm
      # lives in one place and cannot drift from what runs locally.
      - uses: pnpm/action-setup@v6

      # The Node the packages declare in `engines`. One version, not a matrix:
      # the floor is what CI runs, so it is never a claim nobody checked.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # `--frozen-lockfile` so a lockfile that drifted from the manifests fails
      # here rather than being silently repaired.
      - run: pnpm install --frozen-lockfile

      - name: test
        run: pnpm -r test

      - name: typecheck
        if: ${{ !cancelled() }}
        run: pnpm -r typecheck

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: build
        run: pnpm build

      # The `*.test-d.ts` contract recompiled against the BUILT declarations.
      - name: verify types
        run: pnpm verify:types

      # Every suite re-run through `exports` into `dist`: the packages' own,
      # the examples', the prototypes'. They reach `@lntt/*` by NAME, so this
      # executes the BUILT JavaScript — the emit, not the sources it came from.
      - name: verify runtime
        run: pnpm verify:runtime

      # The tarball a consumer would install: packed, unpacked, every entry
      # point `exports` names imported from it. A `files` list that drifts, a
      # missing LICENSE or a `workspace:` range left in the manifest fails
      # here — `npm pack --dry-run` would report all three as a success.
      - name: verify tarball
        run: pnpm verify:tarball
