name: CI

# Two gates, and neither stands in for the other.
#
# `gate` is the one `CLAUDE.md` defines, run by a machine instead of by memory:
# `pnpm -r test` (vitest, with the `*.test-d.ts` type contract typechecked
# inside the run) and `pnpm -r typecheck` (`tsc --noEmit`). Both run on every
# push, the second even when the first has already failed, or a red suite would
# hide a type error behind it. They resolve `@lntt/*` to the SOURCES.
#
# `verify` asks the other question: is what we SHIP still what those gates
# passed against? It builds, then re-runs the same type contract and the same
# suites resolved the way a CONSUMER resolves them — through `exports`, into
# `dist` — and prints the tarball. A declaration that widened a branded
# conditional turns a compile error into a silence in someone else's editor,
# and this is where that silence becomes a red build.
#
# `pnpm -r` reaches `research/*` too, because `pnpm-workspace.yaml` lists it.
# That is deliberate: research is excluded from CODE REVIEW (it is a proving
# ground, not shipped product) but its suites are the measurements the decision
# record cites, so a decision whose evidence has rotted should turn the gate
# red like anything else. They cost about a second.

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes the run before it on the same branch. `main` is the
# exception: its runs are the record of what was green, so they finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No version here on purpose: `pnpm/action-setup` reads the
      # `packageManager` field of the root `package.json`, so the pinned pnpm
      # lives in one place and cannot drift from what runs locally.
      - uses: pnpm/action-setup@v6

      # The Node the packages declare in `engines`. One version, not a matrix:
      # the floor is what CI runs, so it is never a claim nobody checked.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # `--frozen-lockfile` so a lockfile that drifted from the manifests fails
      # here rather than being silently repaired.
      - run: pnpm install --frozen-lockfile

      - name: test
        run: pnpm -r test

      - name: typecheck
        if: ${{ !cancelled() }}
        run: pnpm -r typecheck

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: build
        run: pnpm build

      # The type contract against the BUILT declarations.
      - name: verify types
        run: pnpm verify:types

      # The same suites, importing through `exports` into `dist`.
      - name: verify runtime
        if: ${{ !cancelled() }}
        run: pnpm verify:runtime

      # What the tarball would contain: `dist`, the commented sources, no
      # suites. A `files` list that drifts shows up here.
      - name: verify tarball
        if: ${{ !cancelled() }}
        run: pnpm verify:pack
